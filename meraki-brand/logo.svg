<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <!-- Símbolo: coração/pulso estilizado, combinando cuidado humano com ritmo -->
  <g transform="translate(8, 16)">
    <!-- Quadrado arredondado de fundo (background do mark) -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#5B5BD6"/>

    <!-- Forma principal: pulso cardíaco estilizado em branco -->
    <path d="M 8 24
             L 14 24
             L 17 16
             L 21 32
             L 25 12
             L 29 36
             L 33 24
             L 40 24"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2.8"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Ponto de acento coral: o "pulso" mais forte -->
    <circle cx="25" cy="12" r="2.6" fill="#FF7A45"/>
  </g>

  <!-- Wordmark -->
  <text x="68" y="50"
        font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="32"
        font-weight="700"
        fill="#0C0E14"
        letter-spacing="-1">meraki</text>
</svg>
