<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Estado ativo: com glow coral pulsante -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <polygon points="32,4 58,19 58,45 32,60 6,45 6,19"
           fill="#3D3F8F"
           stroke="#3D3F8F"
           stroke-width="2"
           stroke-linejoin="round"/>

  <polygon points="32,12 52,23 52,41 32,52 12,41 12,23"
           fill="none"
           stroke="#FFFFFF"
           stroke-width="1"
           stroke-opacity="0.4"
           stroke-linejoin="round"/>

  <!-- Pulso central com glow ativo -->
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="5" fill="#FF5A36"/>
    <circle cx="32" cy="32" r="9" fill="none" stroke="#FF5A36" stroke-width="1.5" stroke-opacity="0.7"/>
  </g>

  <!-- Agentes em estado "trabalhando" -->
  <circle cx="32" cy="16" r="3" fill="#00D4C4">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="40" r="3" fill="#FFFFFF">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="40" r="3" fill="#FFFFFF">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>
